spring:
  application:
    name: jeonyoungho-gls-backend

  datasource:
    url: jdbc:h2:mem:gls_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        default_batch_fetch_size: 100
        order_updates: true
        order_inserts: true
        query:
          in_clause_parameter_padding: true
    open-in-view: false

sms:
  base-url: http://localhost:8090
  service-number: 010-1234-5678